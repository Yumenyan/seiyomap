<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星陽ワールド 乗換案内・路線図</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>

  --bd: rgba(60,60,67,0.12); --inp: rgba(118,118,128,0.08);
  --sh: 0 8px 24px rgba(0,0,0,0.08); --r: 16px; --rs: 10px;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
body,html{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial,sans-serif;overflow:hidden;background:#f2f2f7;color:var(--tx)}
#app{display:flex;width:100%;height:100%;position:relative}
#sidebar{width:var(--sw);height:calc(100% - 32px);margin:16px;position:absolute;top:0;left:0;background:var(--bg-glass);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border-radius:24px;box-shadow:var(--sh);border:1px solid rgba(255,255,255,0.6);display:flex;flex-direction:column;z-index:1010;overflow:hidden}
.hdr{padding:18px 20px 12px;background:transparent}
.hdr h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:-.5px}
.hdr p{margin:3px 0 0;font-size:.76rem;color:var(--sub)}
.status-area{margin:0 14px 10px;padding:9px 13px;background:rgba(255,255,255,.6);border-radius:var(--rs);border:1px solid var(--bd);font-size:.77rem;line-height:1.4;color:#48484a}
.retry-btn{margin-top:5px;padding:5px 11px;background:var(--accent);color:#fff;border:none;border-radius:7px;cursor:pointer;font-size:.73rem;font-weight:600}
.upload-area{margin:0 14px 9px;padding:9px;border-radius:var(--rs);background:rgba(0,122,255,.05);border:1px dashed rgba(0,122,255,.3);text-align:center;cursor:pointer;transition:background .2s}
.upload-area:hover{background:rgba(0,122,255,.1)}
.upload-area input{display:none}
.up-hint{font-size:.73rem;color:var(--accent);font-weight:600}
.rsarea{margin:0 14px 10px;border-radius:var(--rs);background:rgba(255,149,0,.08);border:1px solid rgba(255,149,0,.2);overflow:hidden}
.rs-toggle{padding:9px 13px;font-size:.78rem;font-weight:600;color:#c77700;cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center}
.rs-panel{padding:0 13px 11px}
.rs-panel input{width:100%;padding:7px 9px;background:rgba(255,255,255,.8);border:1px solid var(--bd);border-radius:7px;font-size:.76rem;margin-bottom:5px;outline:none}
.rs-panel label{font-size:.69rem;color:var(--sub);display:block;margin-bottom:2px;font-weight:600}

.tabs{display:flex;margin:0 14px 10px;padding:3px;background:rgba(120,120,128,.12);border-radius:11px;gap:0}
.tab{flex:1;padding:7px 4px;text-align:center;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--sub);border-radius:8px;transition:all .2s;white-space:nowrap;min-width:0}
.tab.active{color:var(--tx);background:#fff;box-shadow:0 2px 7px rgba(0,0,0,.1)}
.ctrl{padding:0 14px 10px}
.sbox{width:100%;padding:9px 13px;background:var(--inp);border:1px solid transparent;border-radius:var(--rs);font-size:.86rem;color:var(--tx);outline:none;transition:all .2s}
.sbox:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,122,255,.15)}
.lv{flex:1;overflow-y:auto;padding:0 14px 14px}
.li{padding:11px 13px;margin-bottom:7px;border-radius:var(--rs);background:var(--card);cursor:pointer;font-size:.83rem;border:1px solid var(--bd);box-shadow:0 2px 5px rgba(0,0,0,.03);transition:transform .15s ease,box-shadow .15s ease}
.li:hover{transform:translateY(-1px);box-shadow:0 4px 11px rgba(0,0,0,.06)}
.li.ri{border-left:5px solid var(--accent)}
.it{font-weight:700;color:var(--tx);margin-bottom:2px;display:flex;align-items:center;justify-content:space-between}
.is{font-size:.73rem;color:var(--sub)}
.tl{margin-top:9px;padding-top:9px;border-top:1px solid var(--bd);display:none}
.tl.open{display:block}
.tr{display:flex;align-items:center;padding:5px 3px;border-radius:5px;cursor:pointer;transition:background .15s}
.tr:hover{background:rgba(0,122,255,.08)}
.tb{width:9px;height:9px;border-radius:50%;border:2px solid var(--accent);background:#fff;margin-right:9px;position:relative;flex-shrink:0}
.tr:not(:last-child) .tb::after{content:'';position:absolute;top:9px;left:2px;width:2px;height:16px;background:var(--bd)}
.tn{font-size:.78rem;font-weight:600;color:var(--tx)}
#map-container{width:100%;height:100%;position:absolute;top:0;left:0;z-index:1}
#map{width:100%;height:100%;background:#e5e5ea}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:.7rem;font-weight:700;color:var(--sub);margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}

.sbadge{display:inline-block;font-size:.67rem;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:5px;vertical-align:middle}

.fare-row{display:flex;justify-content:space-between;font-size:.77rem;padding:2px 0;color:var(--tx)}
.fare-total{border-top:1px solid var(--bd);margin-top:5px;padding-top:5px;font-weight:700;font-size:.85rem}
.fare-note{font-size:.67rem;color:var(--sub);margin-top:4px;line-height:1.4}
.detail-panel{border:1px solid var(--bd);border-radius:var(--rs);overflow:hidden;margin-bottom:10px}
.detail-toggle{padding:8px 12px;font-size:.76rem;font-weight:600;color:var(--sub);cursor:pointer;user-select:none;display:flex;justify-content:space-between;align-items:center;background:rgba(120,120,128,.06)}
.detail-body{padding:8px 12px;display:none}
.detail-body.open{display:block}
.detail-body select,.detail-body input[type=number]{width:100%;padding:7px 9px;background:rgba(255,255,255,.9);border:1px solid var(--bd);border-radius:7px;font-size:.8rem;margin-top:3px;outline:none;margin-bottom:8px}
.leaflet-tooltip-custom{background:rgba(28,28,30,.85)!important;backdrop-filter:blur(8px)!important;color:#fff!important;border:none!important;border-radius:6px!important;font-weight:600!important;font-size:11px!important;padding:4px 8px!important;box-shadow:0 4px 12px rgba(0,0,0,.15)!important}
.seg-meta{font-size:.72rem;color:var(--sub);margin-top:3px}

</head>

<div id="app">
  <div id="sidebar">
    <div class="hdr"><h1>🚃 星陽ワールド 乗換案内</h1></div>
    <div class="status-area" id="conn-status">🔄 データ同期中...</div>
    <div class="upload-area" id="drop-zone" onclick="document.getElementById('fin').click()">
      <span class="up-hint">📁 data.json をドロップまたは選択</span>
      <input type="file" id="fin" accept=".json">
    </div>
    <div class="rsarea">
      <div class="rs-toggle" onclick="toggleRS()"><span>📊 利用者データ連携</span><span id="rs-arrow">▾</span></div>
      <div class="rs-panel" id="rs-panel" style="display:none">
        <label>スプレッドシートID</label><input id="rs-sid" placeholder="スプレッドシートID">
        <label>gid（カンマ区切り可）</label><input id="rs-gid" placeholder="例: 0,1591757481">
        <label>GAS Web App URL（任意）</label><input id="rs-gas" placeholder="https://script.google.com/macros/s/.../exec">
        <button class="sbtn" onclick="loadRS()" style="padding:7px;font-size:.78rem">🔄 読み込む</button>
        <div id="rs-st" style="font-size:.7rem;color:var(--sub);margin-top:5px"></div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-r" onclick="sw('routes')">路線一覧</div>
      <div class="tab" id="tab-s" onclick="sw('stations')">駅一覧</div>
      <div class="tab" id="tab-q" onclick="sw('search')">乗換案内</div>
    </div>
    <div class="ctrl" id="sbwrap"><input type="text" id="si" class="sbox" placeholder="🔍 駅名・路線名で絞り込み..."></div>
    <div class="lv" id="lc"><p style="text-align:center;color:var(--sub);font-size:.83rem;margin-top:40px">データ読み込み中...</p></div>
  </div>
  <div id="map-container"><div id="map"></div></div>
</div>
<datalist id="stDL"></datalist>

function parseCSVFare(text){
  const lines = text.trim().split(/\r?\n/);
  if(lines.length < 2) return null;
  const headers = lines[0].split(',').map(h=>h.trim());
  const ops = headers.slice(1); // 事業者名
  const tbl = {};
  ops.forEach(op => tbl[op] = []);
  for(let i=1; i<lines.length; i++){
    const cols = lines[i].split(',');
    ops.forEach((op,j) => {
      const v = parseInt(cols[j+1]);
      if(!isNaN(v)) tbl[op].push(v);
    });
  }
  return tbl;
}

async function loadFareCSV(){
  const targets = ['fare.csv','./fare.csv','data/fare.csv'];

        console.log('✅ fare.csv 読み込み完了:', url, Object.keys(tbl).length+'事業者');
        return true;
      }
    }catch(e){}
  }
  // fare.json も試みる
  const jsonTargets = ['fare.json','./fare.json','data/fare.json'];
  for(const url of jsonTargets){
    try{
      const res = await fetch(url);

      const tbl = await res.json();

function detectSvc(route) {
  const n = String(route.number||'').split('|')[0].trim();
  const nm = String(route.name||'').split('|')[0].split('||')[0].trim();
  const s = n + nm;
  // 新幹線（元：超特急）
  if(/超特急|新幹線|Shinkansen/i.test(s)) return '新幹線';
  // 有料特急（元：特別）
  if(/特別|有料特急/.test(s)) return '有料特急';
  if(/快速急行|快急/.test(s)) return '快速急行';
  if(/特急/.test(s)) return '特急';
  if(/区間急行/.test(s)) return '区間急行';
  if(/急行/.test(s)) return '急行';
  if(/快速/.test(s)) return '快速';
  if(/準急|半急/.test(s)) return '準急';
  if(/空港|エアポート/.test(s)) return '空港';
  // 普通・各停 → 各停に統合
  if(/各停|各駅停車|普通/.test(s)) return '各停';
  // 名前付き特別列車 → 有料特急扱い
  if(n && !/^\d/.test(n) && n.length>0) return '有料特急';
  return '各停';
}

function lookupFare(distBlocks, op){
  const tbl=FARE_TABLE[op];
  if(!tbl) return null;
  const km=Math.max(1,Math.min(tbl.length,Math.round(distBlocks/blockPerKm)));
  return tbl[km-1]??null;
}

function detectOp(route){
  const nm=String(route.name||'').split('||')[0].split('|')[0];
  const nu=String(route.number||'').split('|')[0];
  const s=nm+' '+nu;
  for(const op of OPERATORS){if(s.includes(op))return op;}
  return null;
}

// ═══════════════════════════════════════════
// 距離計算
// ═══════════════════════════════════════════
function calcDist(k1,k2,positions,stations){
  if(positions&&positions[k1]&&positions[k2]){
    const p1=positions[k1],p2=positions[k2];
    const dx=Math.abs(p2.x-p1.x),dy=Math.abs(p2.y-p1.y);
    if(dx===0||dy===0) return Math.sqrt(dx*dx+dy*dy);
    if(Math.abs(dx-dy)<1) return Math.sqrt(dx*dx+dy*dy);
    return dx+dy;
  }
  const i1=k1.split('_')[0],i2=k2.split('_')[0];
  const s1=stations[i1],s2=stations[i2];
  if(s1&&s2) return Math.sqrt(Math.pow(s2.x-s1.x,2)+Math.pow(s2.z-s1.z,2));
  return 0;
}

function renderMap(data){
  if(!data)return;
  const d=Array.isArray(data)?data[0]:data;
  gData=d;
  const routes=d.routes||[],stations=d.stations||{},positions=d.positions||{};
  routeLG.clearLayers();stLG.clearLayers();
  stMk={};rfMap=[];gGraph={};gCoords={};

  let minX=Infinity,minZ=Infinity,hasV=false;
  for(const id in stations){const s=stations[id];if(s&&typeof s.x==='number'&&typeof s.z==='number'){if(s.x<minX)minX=s.x;if(s.z<minZ)minZ=s.z;hasV=true;}}
  oxOff=hasV?minX:0;ozOff=hasV?minZ:0;

  const bounds=[],stCoords={};
  for(const id in stations){
    const s=stations[id];
    if(!s||typeof s.x!=='number'||typeof s.z!=='number')continue;
    const lat=-(s.z-ozOff),lng=s.x-oxOff;
    const pos=[lat,lng];
    bounds.push(pos);stCoords[id]=pos;gCoords[id]=pos;
    const ni=parseName(s.name);
    gGraph[id]=[];
    const mk=L.circleMarker(pos,{radius:5,fillColor:'#fff',color:'#1c1c1e',weight:2.5,opacity:1,fillOpacity:1,pane:'stPane'});
    mk.bindPopup(()=>`<div style="padding:4px"><strong style="font-size:1.05rem">${esc(ni.primary)}</strong><br><span style="color:#8e8e93;font-size:.76rem">${esc(ni.sub)}</span>${buildRSHtml(s.name)}</div>`);
    mk.bindTooltip(ni.primary,{permanent:false,direction:'top',offset:[0,-6],className:'leaflet-tooltip-custom'});
    mk.addTo(stLG);stMk[id]=mk;
  }

  routes.forEach(route=>{
    if(!route||!route.stations||route.stations.length===0)return;
    const numS=String(route.number||'').trim();
    const isOOS=!numS||numS.includes('回送')||numS.includes('試運転');
    const hex=toHex(route.color);
    const ni=parseName(route.name);
    const svcType=detectSvc(route);
    const svcDef=SVC[svcType]||SVC['各停'];
    const op=detectOp(route);

    for(let i=0;i<route.stations.length-1;i++){
      const k1=route.stations[i],k2=route.stations[i+1];
      if(typeof k1!=='string'||typeof k2!=='string')continue;
      const fId=k1.split('_')[0],tId=k2.split('_')[0];
      const seg=[];

      if(positions[k1]&&positions[k2]){
        const p1=positions[k1],p2=positions[k2];
        const x1=p1.x-oxOff,y1=-(p1.y-ozOff),x2=p2.x-oxOff,y2=-(p2.y-ozOff);
        const dx=x2-x1,dy=y2-y1;
        seg.push([y1,x1]);
        if(dx!==0&&dy!==0&&Math.abs(dx)!==Math.abs(dy)){
          const adx=Math.abs(dx),ady=Math.abs(dy);
          if(p1.vertical){
            let my=y2-Math.sign(dy)*adx;
            if(Math.sign(my-y1)===Math.sign(dy))seg.push([my,x1]);
            else{let mx=x2-Math.sign(dx)*ady;seg.push([y1,mx]);}
          } else {
            let mx=x2-Math.sign(dx)*ady;
            if(Math.sign(mx-x1)===Math.sign(dx))seg.push([y1,mx]);
            else{let my=y2-Math.sign(dy)*adx;seg.push([my,x1]);}
          }
        }
        seg.push([y2,x2]);
      } else if(stCoords[fId]&&stCoords[tId]){
        seg.push(stCoords[fId]);seg.push(stCoords[tId]);
      }
      if(seg.length<2)continue;

      const pl=L.polyline(seg,{color:hex,weight:5,opacity:.85,lineJoin:'round',lineCap:'round'}).addTo(routeLG);
      pl.bindPopup(`<div style="font-size:.86rem"><strong style="color:${hex}">${esc(ni.primary)}</strong><br><span style="font-size:.73rem;color:#8e8e93">${esc(ni.sub)}</span></div>`);
      rfMap.push({routeObj:route,fromId:fId,toId:tId,polyline:pl,color:hex,latlngs:seg});

      if(!isOOS&&stations[fId]&&stations[tId]){
        const dist=calcDist(k1,k2,positions,stations);
        if(!gGraph[fId])gGraph[fId]=[];
        gGraph[fId].push({to:tId,posKey1:k1,posKey2:k2,route:route,realDist:dist,serviceType:svcType,speedWeight:svcDef.sw,operator:op});
      }
    }
  });

  // 同名駅・接続駅仮想エッジ
  const nGrp={};
  for(const id in stations){
    if(!gGraph[id])continue;
    const pn=parseName(stations[id].name).primary;
    if(!nGrp[pn])nGrp[pn]=[];nGrp[pn].push(id);
  }
  function addVE(a,b,vt){
    if(!a||!b||a===b||!gGraph[a]||!gGraph[b])return;
    if(gGraph[a].some(e=>e.isVirtual&&e.to===b&&e.vt===vt))return;
    const cost=VTC[vt]||250;
    gGraph[a].push({to:b,route:{number:'__VT_'+vt,name:'',isVirtual:true,vt:vt},realDist:cost,speedWeight:1,serviceType:'各停',isVirtual:true,vt:vt,operator:null});
  }
  for(const pn in nGrp){const ids=nGrp[pn];if(ids.length<2)continue;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){addVE(ids[i],ids[j],'sameName');addVE(ids[j],ids[i],'sameName');}}
  for(const id in stations){
    const cs=stations[id].connections;
    if(!Array.isArray(cs)||cs.length===0)continue;
    cs.forEach(oid=>{if(!stations[oid])return;addVE(id,oid,'connection');addVE(oid,id,'connection');});
  }

  if(bounds.length>0)map.fitBounds(L.latLngBounds(bounds).pad(.08));
  const dl=document.getElementById('stDL');
  if(dl){dl.innerHTML='';const un=[...new Set(Object.values(stations).map(s=>parseName(s.name).primary))].sort();un.forEach(n=>{const o=document.createElement('option');o.value=n;dl.appendChild(o);})}
  updateList();
}

// ═══════════════════════════════════════════
// ダイクストラ探索
// ═══════════════════════════════════════════
function edgeCostW(edge,mode){
  if(edge.isVirtual)return edge.realDist;
  const sw=edge.speedWeight||1.0;
  switch(mode){
    case 'time':    return edge.realDist*sw;
    case 'express': return edge.realDist*Math.pow(sw,2.2);
    case 'fare':    return edge.realDist;
    case 'balanced':default: return edge.realDist*Math.pow(sw,.75);
  }
}

function xferPenalty(mode){
  return{time:280,express:700,fare:7000,balanced:4000}[mode]||3500;
}

function findPath(startIds,endIds,mode){
  if(!startIds||!startIds.length||!endIds||!endIds.length)return null;
  const endSet=new Set(endIds);
  let dist={},back={},pq=[];
  for(const sid of startIds){
    if(!gGraph[sid])continue;
    const k=sid+'_NONE';dist[k]=0;
    pq.push({stId:sid,lrk:'NONE',lsId:null,cost:0,usedR:new Set(),key:k});
  }
  let tKey=null,tCost=Infinity;
  while(pq.length>0){
    pq.sort((a,b)=>a.cost-b.cost);
    const cur=pq.shift();
    if(cur.cost>dist[cur.key])continue;
    if(endSet.has(cur.stId)){if(cur.cost<tCost){tCost=cur.cost;tKey=cur.key;}continue;}
    for(const edge of(gGraph[cur.stId]||[])){
      if(edge.to===cur.lsId)continue;
      if(!edge.isVirtual&&excludedRoutes.has(routeKey(edge.route)))continue;
      const rk=edge.isVirtual?edge.route.number:routeKey(edge.route);
      const curVirt=cur.lrk&&cur.lrk.startsWith('__VT_');
      const nxtVirt=edge.isVirtual;
      const isXfer=!curVirt&&!nxtVirt&&cur.lrk!=='NONE'&&cur.lrk!==rk;
      let ec=edgeCostW(edge,mode);
      let xp=0;
      if(isXfer){
        xp=xferPenalty(mode);
        const cr=new Set(cur.usedR);
        if(cur.lrk!=='NONE'&&!curVirt)cr.add(cur.lrk);
        if(cr.has(rk))xp+=300000;
      }
      const nk=edge.to+'_'+rk;
      const nc=cur.cost+ec+xp;
      if(dist[nk]===undefined||nc<dist[nk]){
        dist[nk]=nc;
        back[nk]={fk:cur.key,fSt:cur.stId,tSt:edge.to,route:edge.route,realDist:edge.realDist,svcType:edge.serviceType,op:edge.operator};
        const nu=new Set(cur.usedR);if(cur.lrk!=='NONE'&&!curVirt)nu.add(cur.lrk);
        pq.push({stId:edge.to,lrk:rk,lsId:cur.stId,cost:nc,usedR:nu,key:nk});
      }
    }
  }
  if(!tKey)return null;
  let path=[],ck=tKey;
  while(back[ck]){const s=back[ck];path.unshift({to:s.tSt,from:s.fSt,route:s.route,realDist:s.realDist,svcType:s.svcType,op:s.op});ck=s.fk;}
  return path;
}

function findPathWP(startIds,wpIds,endIds,mode){
  if(!wpIds||!wpIds.length)return findPath(startIds,endIds,mode);
  const p1=findPath(startIds,wpIds,mode);if(!p1||!p1.length)return null;
  const last=p1[p1.length-1];
  const p2=findPath([last.to],endIds,mode);if(!p2||!p2.length)return null;
  return p1.concat(p2);
}

function execSearch(){
  const sn=document.getElementById('r-start').value.trim();
  const wn=document.getElementById('r-wp').value.trim();
  const en=document.getElementById('r-end').value.trim();
  const mode=document.getElementById('r-mode').value;
  const resEl=document.getElementById('s-results');
  if(!sn||!en)return;

  const sIds=stIdsByName(sn),wIds=wn?stIdsByName(wn):[],eIds=stIdsByName(en);
  if(!sIds.length||!eIds.length){resEl.innerHTML='<p style="color:#ff3b30;font-size:.8rem;text-align:center">⚠️ 駅が見つかりません</p>';resetHL();return;}

  const path=findPathWP(sIds,wIds,eIds,mode);
  if(!path||!path.length){resEl.innerHTML='<p style="color:#ff3b30;font-size:.8rem;text-align:center">⚠️ 経路が見つかりません</p>';resetHL();return;}

  // マップ強調
  rfMap.forEach(s=>s.polyline.setStyle({color:'#8e8e93',weight:3,opacity:.15}));
  virtualHL.forEach(l=>routeLG.removeLayer(l));virtualHL=[];
  path.forEach(step=>{
    if(step.route.isVirtual){
      const p1=gCoords[step.from],p2=gCoords[step.to];
      if(p1&&p2){const dl=L.polyline([p1,p2],{color:'#ffcc00',weight:4,opacity:.9,dashArray:'6,8'}).addTo(routeLG);dl.bringToFront();virtualHL.push(dl);}
      return;
    }
    rfMap.filter(s=>s.routeObj===step.route&&((s.fromId===step.from&&s.toId===step.to)||(s.fromId===step.to&&s.toId===step.from))).forEach(t=>{t.polyline.setStyle({color:t.color,weight:8,opacity:1});t.polyline.bringToFront();});
  });

  // セグメント分解
  const segs=[];
  path.forEach(step=>{
    const fn=parseName((gData.stations[step.from]||{}).name||'').primary;
    const tn=parseName((gData.stations[step.to]||{}).name||'').primary;
    if(step.route.isVirtual){segs.push({type:'virtual',vt:step.route.vt,from:fn,to:tn});return;}
    const ni=parseName(step.route.name);
    const numS=String(step.route.number||'').trim().split('|')[0];
    const rk=routeKey(step.route);
    const last=segs[segs.length-1];
    if(last&&last.type==='ride'&&last.rk===rk){
      last.to=tn;last.count++;last.dist=(last.dist||0)+(step.realDist||0);
    } else {
      segs.push({type:'ride',rk:rk,lineName:ni.primary,numS:numS,svcType:step.svcType||'各停',from:fn,to:tn,color:toHex(step.route.color),count:1,dist:step.realDist||0,op:step.op});
    }
  });

  // 運賃計算
  const opDist={};
  segs.forEach(sg=>{if(sg.type==='ride'&&sg.op)opDist[sg.op]=(opDist[sg.op]||0)+(sg.dist||0);});
  const fareItems=[];let totalFare=0;
  for(const [op,db] of Object.entries(opDist)){
    const f=lookupFare(db,op);
    if(f!==null){const km=(db/blockPerKm).toFixed(1);fareItems.push({op,km,fare:f});totalFare+=f;}
  }
  const unknownOps=segs.filter(sg=>sg.type==='ride'&&!sg.op).length>0;

  // HTML生成
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><h4 style="margin:0;font-size:.86rem;color:var(--tx)">🔍 検索結果</h4><button onclick="resetHL()" style="cursor:pointer;background:rgba(120,120,128,.12);border:none;padding:4px 10px;border-radius:6px;font-size:.73rem;font-weight:600">クリア</button></div>`;

  segs.forEach((sg,i)=>{
    if(sg.type==='virtual'){
      const lb=sg.vt==='sameName'?'同名駅間の徒歩':'接続徒歩';
      html+=`<div class="tn-node">🚶 ${esc(sg.from)} → ${esc(sg.to)}（${lb}）</div>`;
      return;
    }
    if(i>0&&segs[i-1].type==='ride')html+=`<div class="tn-node">🔀 ${esc(sg.from)}駅で乗り換え</div>`;
    const sdef=SVC[sg.svcType]||SVC['各停'];
    const typeDisp=sg.numS?`[${sg.numS}]`:'';
    const kmDisp=sg.dist>0?(sg.dist/blockPerKm).toFixed(1):'?';
    html+=`<div class="rc" style="border-left:5px solid ${sg.color}">
      <div style="display:flex;align-items:center;flex-wrap:wrap;gap:3px">
        ${svBadge(sg.svcType)}
        <strong style="color:var(--tx);font-size:.86rem">${esc(sg.lineName)}</strong>
        ${typeDisp?`<span style="font-size:.73rem;color:var(--accent);background:rgba(0,122,255,.1);padding:1px 5px;border-radius:4px">${esc(typeDisp)}</span>`:''}
        ${sg.op?`<span style="font-size:.67rem;color:var(--sub);margin-left:2px">（${esc(sg.op)}）</span>`:''}
      </div>
      <div style="margin-top:5px;font-size:.82rem;font-weight:600">${esc(sg.from)} ➔ ${esc(sg.to)}</div>
      <div class="seg-meta">🚉 ${sg.count}駅間　📏 約${kmDisp}km</div>
    </div>`;
  });

  // 運賃表示
  if(fareItems.length>0||unknownOps){
    html+=`<div class="fare-box"><div style="font-size:.78rem;font-weight:700;margin-bottom:6px;color:var(--tx)">💰 運賃概算</div>`;
    fareItems.forEach(fi=>{html+=`<div class="fare-row"><span>${esc(fi.op)} <span style="color:var(--sub);font-size:.7rem">(${fi.km}km)</span></span><span style="font-weight:600">${fi.fare.toLocaleString()}円</span></div>`;});
    if(fareItems.length>1){html+=`<div class="fare-row fare-total"><span>合計</span><span>¥${totalFare.toLocaleString()}</span></div>`;}
    if(unknownOps){html+=`<div class="fare-note">※一部路線の事業者が自動検出できませんでした</div>`;}
    html+=`<div class="fare-note">⚠️ 座標距離から算出した概算です。カーブ等により実際の営業キロとは異なる場合があります。<br>スケール設定: 1km = ${blockPerKm}ブロック（詳細設定で変更可）</div></div>`;
  }

  resEl.innerHTML=html;
  const pts=[];path.forEach(s=>{if(gCoords[s.from])pts.push(gCoords[s.from]);if(gCoords[s.to])pts.push(gCoords[s.to]);});
  if(pts.length>0)map.fitBounds(L.latLngBounds(pts).pad(.2));
}

function filterExclude(q){
  lastExQ=(q||'').toLowerCase();
  const el=document.getElementById('exc-list');if(!el||!gData)return;
  const routes=gData.routes||[];let html='';const seen=new Set();
  routes.forEach(r=>{
    if(!r)return;const k=routeKey(r);if(seen.has(k))return;seen.add(k);
    const ni=parseName(r.name);const ns=String(r.number||'').trim();const hex=toHex(r.color);
    const dp=`${ni.primary} ${ns?`[${ns}]`:''}`.trim();
    const match=dp.toLowerCase().includes(lastExQ);const chk=excludedRoutes.has(k);
    if(match||chk){
      const ek=encodeURIComponent(k);
      html+=`<label style="display:flex;align-items:center;margin-bottom:5px;cursor:pointer"><input type="checkbox" ${chk?'checked':''} onchange="toggleEx('${ek}',this.checked)" style="margin-right:6px"><span style="width:9px;height:9px;background:${hex};border-radius:2px;margin-right:5px;flex-shrink:0;display:inline-block"></span><span style="font-size:.76rem"><strong>${esc(ni.primary)}</strong>${ns?` <span style="color:var(--accent);font-size:.7rem">[${esc(ns)}]</span>`:''}</span></label>`;
    }
  });
  el.innerHTML=html||'<span style="color:var(--sub);font-size:.73rem">該当なし</span>';
}

function toggleEx(ek,checked){const k=decodeURIComponent(ek);if(checked)excludedRoutes.add(k);else excludedRoutes.delete(k);saveEx();}

function parseCSV(t){
  const rows=[];let row=[],f='',inQ=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(inQ){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else inQ=false;}else f+=c;}
    else{if(c==='"')inQ=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}}
  if(f||row.length){row.push(f);rows.push(row);}return rows;
}

async function fetchSheetRows(sid,gid,gas){
  if(gas){const r=await fetch(gas+(gas.includes('?')?'&':'?')+(gid?'gid='+encodeURIComponent(gid):''));if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();return j.values||j;}
  if(!sid)throw new Error('ID未入力');
  const url=`https://docs.google.com/spreadsheets/d/${encodeURIComponent(sid)}/gviz/tq?tqx=out:csv${gid?'&gid='+encodeURIComponent(gid):''}`;
  const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return parseCSV(await r.text());
}

async function loadRS(){
  const sid=document.getElementById('rs-sid').value.trim();
  const rawGid=document.getElementById('rs-gid').value.trim();
  const gas=document.getElementById('rs-gas').value.trim();
  const st=document.getElementById('rs-st');
  if(!sid&&!gas){st.textContent='⚠️ IDまたはURLを入力してください';return;}
  try{localStorage.setItem('mtr_rs_sid',sid)}catch(e){}
  try{localStorage.setItem('mtr_rs_gid',rawGid)}catch(e){}
  try{localStorage.setItem('mtr_rs_gas',gas)}catch(e){}
  st.textContent='📡 取得中...';
  const gids=rawGid?rawGid.split(/[,;\s]+/).filter(Boolean):[RS_GID];
  let combined={},ok=0,lastErr=null;
  for(const g of gids){
    try{
      const rows=await fetchSheetRows(sid,g,gas);
      if(!rows||rows.length<2)continue;
      const hd=rows[0].map(h=>(h||'').toString().trim());
      // 利用者データ(SR) と 利用者数データ(私鉄) 両方に対応
      const ci={
        '駅名':hd.indexOf('駅名'),
        '読み':hd.indexOf('読み'),
        '定数':hd.indexOf('定数'),
        '級':hd.indexOf('級'),
        '所在国':hd.indexOf('所在国'),
        '利用客':hd.findIndex(h=>h.includes('利用客')||h.includes('利用者')),
        '等級':hd.findIndex(h=>h.includes('等級')||h.includes('級')),
      };
      if(ci['駅名']===-1)continue;
      for(let r=1;r<rows.length;r++){
        const row=rows[r];
        const n=(row[ci['駅名']]||'').toString().trim();
        if(!n)continue;
        const gradeIdx = ci['等級']>=0 ? ci['等級'] : ci['級'];
        combined[n]={
          yomi:     ci['読み']>=0  ?(row[ci['読み']]  ||'').toString().trim():'',
          constant: ci['定数']>=0  ?(row[ci['定数']]  ||'').toString().trim():'',
          grade:    gradeIdx>=0    ?(row[gradeIdx]    ||'').toString().trim():'',
          country:  ci['所在国']>=0?(row[ci['所在国']]||'').toString().trim():'',
          riders:   ci['利用客']>=0?(row[ci['利用客']]||'').toString().trim():'',
          // 既存データを上書きしない（SRデータと私鉄データをマージ）
          ...combined[n],
          // ridersは最新値を優先
          riders: (ci['利用客']>=0&&(row[ci['利用客']]||'').toString().trim()) || (combined[n]&&combined[n].riders) || '',
          grade:  (gradeIdx>=0&&(row[gradeIdx]||'').toString().trim()) || (combined[n]&&combined[n].grade) || '',
        };
      }
      ok++;
    }catch(e){lastErr=e;}
  }
  if(Object.keys(combined).length>0){
    ridershipMap=combined;
    try{localStorage.setItem('mtr_rs_cache',JSON.stringify({map:ridershipMap,at:Date.now()}))}catch(e){}
    st.textContent=`✅ ${ok}シート / ${Object.keys(ridershipMap).length}駅 読込`;
    updateList();
  } else {
    st.innerHTML=`❌ ${lastErr?lastErr.message:'データなし'}`;
  }
}

function lookupRS(raw){const p=parseName(raw).primary;const s=stripCode(p);return ridershipMap[s]||ridershipMap[p]||null;}
function fmtR(v){const n=Number(String(v).replace(/,/g,''));return isNaN(n)?v||'―':n.toLocaleString('ja-JP');}

function buildRSHtml(raw){
  const info=lookupRS(raw);if(!info)return'';
  const parts=[];
  if(info.yomi)   parts.push(`📖 読み: <strong>${esc(info.yomi)}</strong>`);
  if(info.riders) parts.push(`👥 利用客: <strong>${fmtR(info.riders)}</strong>`);
  if(info.grade)  parts.push(`🏅 等級: <strong>${esc(info.grade)}級</strong>`);
  if(info.constant) parts.push(`定数: ${esc(info.constant)}`);
  if(info.country)  parts.push(`🌐 ${esc(info.country)}`);
  if(!parts.length)return'';
  return`<div class="ri-block">${parts.join('<br>')}</div>`;
}

function initRS(){
  try{
    document.getElementById('rs-sid').value=localStorage.getItem('mtr_rs_sid')||RS_SID;
    document.getElementById('rs-gid').value=localStorage.getItem('mtr_rs_gid')||RS_GID;
    document.getElementById('rs-gas').value=localStorage.getItem('mtr_rs_gas')||'';
    const cache=localStorage.getItem('mtr_rs_cache');
    if(cache){const c=JSON.parse(cache);if(c&&c.map)ridershipMap=c.map;}
  }catch(e){}
  loadRS();
}
</script>
